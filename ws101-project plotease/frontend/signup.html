<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlotEase - Signup</title>

<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<body>

<div class="signup-card">

  <!-- LOGO -->
  <div class="login-logo">
    <div class="logo-mark small">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 19V5m0 14h16M8 15l3-3 2 2 5-5"/>
      </svg>
    </div>

    <div>
      <div class="logo-text">PlotEase</div>
      <div class="logo-sub">Student Plotting System</div>
    </div>
  </div>

  <!-- TITLE -->
  <div class="signup-title">Create Account</div>
  <div class="signup-desc">Sign up to access your student plotting system</div>

  <!-- FORM -->
  <div class="field-group">
    <label>User ID</label>
    <input type="text" id="userId" placeholder="PLT-0001" required>
  </div>

  <div class="field-group">
    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Juan Dela Cruz" required>
  </div>

  <div class="field-group">
    <label>Student ID</label>
    <input type="text" id="studentId" placeholder="STU10294" required>
  </div>

  <div class="field-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="student@email.com" required>
  </div>

  <div class="field-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Create password" required>
  </div>

  <!-- BUTTON -->
  <button type="button" class="btn btn-primary btn-full" onclick="handleSignup()">
    Create Account
  </button>

  <!-- FOOTER -->
  <div class="signup-footer">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>
<!-- Toast Notifications -->
<div id="toast-container"></div>

<!-- Load PlotEase Engine -->
<script src="app.js"></script>
</body>
</html>
